[package]
name = "hinder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hinder: an open-source, privacy-first Finder companion for macOS, written in Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/yaasiinaxmed/Hinder-Desktop-App"
keywords = ["macos", "finder", "file-manager", "egui", "search"]
categories = ["filesystem", "gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", default-features = false }
walkdir = "2"
sha2 = "0.10"
xattr = "1"
plist = "1"
trash = "5"
chrono = "0.4"
dirs = "6"
rayon = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
