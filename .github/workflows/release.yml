name: Release

# How versions work:
# 1. Commit to main using Conventional Commits (feat:, fix:, ...).
# 2. release-please opens/updates a "chore(main): release x.y.z" PR that bumps
#    Cargo.toml and writes CHANGELOG.md.
# 3. Merge that PR -> a git tag + GitHub Release are created, and the job below
#    builds the universal Hinder.app and attaches the .dmg and .zip.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal Hinder.app
        run: ./scripts/bundle.sh

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.dmg dist/*.zip --clobber
